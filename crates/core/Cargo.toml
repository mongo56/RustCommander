[package]
name = "rc-core"
description = "UI-agnostic core of RustCommander: panels, entries, sorting, commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
trash.workspace = true
memchr = "2.7"
regex = "1"
similar = { version = "3.2.1", default-features = false, features = ["std"] }
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "zstd"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"

[target.'cfg(windows)'.dependencies]
junction = "2.1"

[dev-dependencies]
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
