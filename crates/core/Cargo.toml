[package]
name = "rc-core"
description = "UI-agnostic core of RustCommander: panels, entries, sorting, commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
trash.workspace = true
memchr = "2.7"
sha2 = "0.11"
crc32fast = "1"
regex = "1"
similar = { version = "3.2.1", default-features = false, features = ["std"] }
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "zstd", "aes-crypto"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "bzip2", "ppmd", "deflate", "aes256"] }
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
suppaftp = { version = "12.2", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
ring = "0.17"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }
unrar_sys = "0.5.8"

[target.'cfg(windows)'.dependencies]
junction = "2.1"

[dev-dependencies]
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "aes256"] }
libunftp = { version = "0.24", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
