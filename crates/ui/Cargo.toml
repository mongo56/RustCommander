[package]
name = "rustcommander"
description = "A fast, keyboard-driven, dual-panel file manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rc-core.workspace = true
rc-platform.workspace = true
iced.workspace = true
image = "0.24"
raw-window-handle = "0.6"
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
unicode-segmentation = "1"
# Update check (GitHub releases API) and download; rustls with the ring
# provider like the FTPS code, webpki roots.
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
sha2 = "0.11"
# Built-in terminal (F9): VT parser, grid and ConPTY I/O thread; we draw the grid.
alacritty_terminal = "=0.26.0"
# Its PTY trait's poller types (`TapPty` wraps its Pty); the same version it uses.
polling = "3"
# Markdown view of the viewer (F3 on .md): parser only, we draw the blocks.
pulldown-cmark = { version = "0.13", default-features = false }
# Links in the built-in terminal (web addresses, paths).
regex = "1"

[target.'cfg(windows)'.dependencies]
# SetDllDirectoryW for the built-in terminal (same version as alacritty_terminal's).
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_LibraryLoader"] }

[build-dependencies]
png = "0.17"
