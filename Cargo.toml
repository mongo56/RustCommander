[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/ui"]

[workspace.package]
version = "0.5.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/mongo56/RustCommander"

[workspace.dependencies]
rc-core = { path = "crates/core" }
rc-platform = { path = "crates/platform" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# web-colors: blend in sRGB space like browsers (and iced's tiny-skia renderer).
# The default linear-space blending makes dark-on-light text thin and washed out.
iced = { version = "0.13.1", features = ["lazy", "image", "advanced", "web-colors"] }
open = "5"
trash = "5"

# Optimise dependencies (iced, wgpu, text shaping) even in debug builds so
# the UI stays smooth during development; our own crates still build fast.
[profile.dev]
# Line tables only: backtraces keep file:line, PDBs stay small.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
